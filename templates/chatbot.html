{% extends "base.html" %}

{% block content %}
<div class="chatbot-container">
    <div class="chatbot-header bg-primary text-white p-3 rounded-top">
        <h4><i class="fas fa-robot me-2"></i> CareerGPT Assistant</h4>
    </div>
    <div class="chatbot-messages p-3">
        <div class="message bot">
            <p>Hello! I'm your AI career assistant. How can I help you today?</p>
        </div>
    </div>
    <div class="chatbot-input p-3 bg-light">
        <div class="input-group">
            <input type="text" class="form-control" placeholder="Ask about careers...">
            <button class="btn btn-primary" id="send-message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <small class="text-muted">Try: "What careers match my personality?"</small>
    </div>
</div>

<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
{% endblock %}
